<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RetroByte · Products &amp; Prices</title>
  <link rel="preconnect" href="https://wsrv.nl" crossorigin>
  <link rel="preconnect" href="https://docs.google.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="stylesheet" href="cart.css?v=4">
  <link rel="stylesheet" href="order.css">
</head>

<body>
  <div aria-hidden="true"><span class="shoot s1"></span><span class="shoot s2"></span><span class="shoot s3"></span>
  </div>
  <div class="wrap">
    <header class="hero">
      <div class="logo"><span class="mark" aria-hidden="true"></span><span class="re">RETRO</span><span
          class="by">BYTE</span></div>
      <h1 class="tagline"><span class="l1">Tomorrow<span class="p a">’</span>s tech<span
            class="p c">,</span></span><span class="l2">yesterday<span class="p a">’</span>s soul.</span></h1>
      <p class="sub"><b>Retro-futuristic gadgets</b> and everyday tech accessories.</p>
      <div class="nav"><a class="btn" href="#shop">Shop now</a></div>
    </header>

    <section id="shop">
      <div class="tools">
        <div class="chips" id="chips"></div>
        <input type="search" id="q" placeholder="Search" aria-label="Search products">
        <button type="button" class="filter-btn" id="filterbtn" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
            <circle cx="16" cy="7" r="2.2" />
            <circle cx="8" cy="17" r="2.2" />
          </svg>
          <span>Filters</span><span class="fcount" id="fcount" hidden></span>
        </button>
        <div class="factive" id="factive" hidden></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>


    <footer>
      Prices in BDT, delivery charges extra. Cash on delivery across Bangladesh. © RetroByte
    </footer>
  </div>

  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script src="order.js"></script>
  <script src="script.js"></script>
</body>

</html>
